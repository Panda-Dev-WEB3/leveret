# Leveret website + dev oracle (devnet) on leveret.net; www redirects to the
# bare domain. Certbot adds the 443 block on first issue.
server {
    listen 80;
    listen [::]:80;
    server_name leveret.net www.leveret.net;

    if ($host = www.leveret.net) {
        return 301 https://leveret.net$request_uri;
    }

    root /opt/leveret/current;
    index index.html;
    include snippets/security-headers.conf;

    # Next.js static export with trailingSlash: /dashboard/ -> dashboard/index.html
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;

    # hashed build assets never change
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include snippets/security-headers.conf;
    }

    # dev oracle, same origin (loopback only): signed quotes and the test-USDC faucet
    location = /api/faucet {
        limit_req zone=leveret_faucet burst=2 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8787/faucet;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
    location /api/ {
        limit_req zone=leveret_api burst=40 nodelay;
        limit_req_status 429;
        client_max_body_size 1k;
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
