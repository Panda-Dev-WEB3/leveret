# Former address of the Leveret site: permanent redirect to leveret.net.
# Keeps its own certificate so https links still redirect cleanly.
server {
    server_name leveret.bookrunner.tech;
    include snippets/security-headers.conf;
    return 301 https://leveret.net$request_uri;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/leveret.bookrunner.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/leveret.bookrunner.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    listen 80;
    listen [::]:80;
    server_name leveret.bookrunner.tech;
    return 301 https://leveret.net$request_uri;
}
