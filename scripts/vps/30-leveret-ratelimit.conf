# Leveret: per-IP limits for the dev oracle behind /api/ (http context).
# The faucet mints test USDC and pays devnet rent for new token accounts, so
# it is the tight one.
limit_req_zone $binary_remote_addr zone=leveret_faucet:10m rate=2r/m;
limit_req_zone $binary_remote_addr zone=leveret_api:10m rate=10r/s;
