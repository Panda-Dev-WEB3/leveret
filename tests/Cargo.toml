[package]
name = "lvrt_tests"
version = "0.1.0"
description = "LiteSVM integration tests for the Leveret programs (run after `anchor build`)"
edition.workspace = true
rust-version.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anchor-lang = "=1.1.2"
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-account = "3"
solana-clock = "3"
solana-program-pack = "3"
solana-program-option = "3"
spl-token-interface = "2.0.0"
lvrt_common = { path = "../crates/lvrt_common" }
lvrt_math = { path = "../crates/lvrt_math" }
lvrt_gov = { path = "../programs/lvrt_gov", features = ["cpi"] }
lvrt_oracle = { path = "../programs/lvrt_oracle", features = ["cpi"] }
lvrt_engine = { path = "../programs/lvrt_engine", features = ["cpi"] }
lvrt_tickets = { path = "../programs/lvrt_tickets", features = ["cpi"] }
lvrt_power = { path = "../programs/lvrt_power", features = ["cpi"] }
lvrt_vault = { path = "../programs/lvrt_vault", features = ["cpi"] }
lvrt_insurance = { path = "../programs/lvrt_insurance", features = ["cpi"] }
lvrt_fee_router = { path = "../programs/lvrt_fee_router", features = ["cpi"] }
