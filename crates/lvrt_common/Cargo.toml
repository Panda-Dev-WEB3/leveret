[package]
name = "lvrt_common"
version = "0.1.0"
description = "Shared on-chain types, seeds and constants for Leveret programs"
edition.workspace = true
rust-version.workspace = true

[lib]
name = "lvrt_common"

[features]
idl-build = ["anchor-lang/idl-build"]
# Test-cluster build: swaps USDC_MINT for the Leveret test mint.
devnet = []

[dependencies]
anchor-lang = "=1.1.2"
lvrt_math = { path = "../lvrt_math" }
solana-instructions-sysvar = "3.0.1"
solana-sha256-hasher = "3.1.0"
